name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android || true
      - name: Check icons
        run: |
          RES=android/app/src/main/res
          if ! ls $RES/mipmap*/ic_launcher_background* >/dev/null 2>&1; then
            echo "Adaptive icon background missing, using plain icons"
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk biblia-citeste-asculta-si-stud.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: biblia-citeste-asculta-si-stud.apk
